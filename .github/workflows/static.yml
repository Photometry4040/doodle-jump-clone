name: Deploy Doodle Jump Clone

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pygbag
      - name: Build with pygbag
        run: |
          cd doodle_jump_clone
          python -m pygbag --build main.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './doodle_jump_clone/build/web'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 